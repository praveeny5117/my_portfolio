      "@context": "https://schema.org",

      "name": "Praveen Y",

      ]
    }
    </script>

    <!-- Theme Initializer - Default to Dark Theme -->
    <script>
      (function() {
        const root = document.documentElement;
        const saved = localStorage.getItem('portfolio-theme');
        if (saved === 'light') {
          root.classList.remove('dark');
          root.classList.add('light');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
          localStorage.setItem('portfolio-theme', 'dark');
        }
      })();
    </script>

  <body class="bg-[#F8F9FA] dark:bg-[#050505] text-[#0F172A] dark:text-[#F3F4F6] selection:bg-[#00F0FF]/25 selection:text-[#00F0FF] antialiased min-h-screen overflow-x-hidden font-sans transition-colors duration-300">
