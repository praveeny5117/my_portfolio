<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="terminal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.06)" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.4" flood-color="#00F0FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box matching Navbar Terminal icon container -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" ry="7.5" fill="url(#terminal-bg)" stroke="url(#terminal-border)" stroke-width="1.2" />

  <!-- Lucide Terminal Icon: >_ -->
  <g transform="translate(8, 8) scale(0.666667)" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#subtle-glow)">
    <polyline points="4 5 10 11 4 17" />
    <line x1="12" y1="19" x2="20" y2="19" />
  </g>
</svg>
